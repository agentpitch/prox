name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # package-release.ps1 checks the committed HEAD diff. Keep its parent
          # available so a shallow checkout is not mistaken for a root commit.
          fetch-depth: 2

      - name: Setup pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.8"
          architecture: x64
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Setup pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.0"

      - name: Resolve artifact version
        id: release-version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check reachable Go vulnerabilities
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOWORK = "off"
          $env:GOENV = "off"
          go run -mod=readonly golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Test, build, verify, and package
        shell: powershell
        run: |
          & .\tools\package-release.ps1 -Version "${{ steps.release-version.outputs.version }}" -DownloadWinDivertArchive
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pitchProx-windows-amd64
          if-no-files-found: error
          path: |
            build/candidates/${{ steps.release-version.outputs.version }}/pitchProx.exe
            build/candidates/${{ steps.release-version.outputs.version }}/pitchProx-windows-amd64.zip
            build/candidates/${{ steps.release-version.outputs.version }}/pitchProx-windows-amd64.sha256
            build/candidates/${{ steps.release-version.outputs.version }}/pitchProx-build-manifest.json
            build/candidates/${{ steps.release-version.outputs.version }}/RELEASE_NOTES.md

  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: tools

      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pitchProx-windows-amd64
          path: release-assets

      - name: Verify packaged artifacts
        shell: bash
        working-directory: release-assets
        run: sha256sum --check pitchProx-windows-amd64.sha256

      - name: Test release verification gate
        run: python3 tools/verify-github-release.test.py

      - name: Refuse changes to an already published release
        shell: bash
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/verify-github-release.py preflight --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"

      - name: Upload draft GitHub release
        id: draft-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          body_path: release-assets/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/pitchProx.exe
            release-assets/pitchProx-windows-amd64.zip
            release-assets/pitchProx-windows-amd64.sha256
            release-assets/pitchProx-build-manifest.json

      - name: Verify assets, publish, and confirm older updater availability
        shell: bash
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          python3 tools/verify-github-release.py prepare \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --release-id "$RELEASE_ID" --publish-body "$RUNNER_TEMP/publish-release.json"
          timeout 15s gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input "$RUNNER_TEMP/publish-release.json" --silent
          python3 tools/verify-github-release.py published \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --release-id "$RELEASE_ID"
